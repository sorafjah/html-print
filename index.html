<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルビふりお2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body * { visibility: hidden; }
            #preview-container, #preview-container * { visibility: visible; }
            #preview-container { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; box-shadow: none; background: white; }
        }
        .preview-content {
            font-family: "BIZ UDPGothic","BIZ UDGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","Yu Gothic",sans-serif;
            line-height: 2.0; overflow-wrap: break-word;
        }
        .page-hp { width: 100%; padding: 2rem; background: white; min-height: 100%; }
        .ruby-edit-mode ruby { display: inline-ruby; position: relative; cursor: pointer; border-radius: 4px; background-color: transparent; border-bottom: 1px dotted #ccc; }
        .ruby-edit-mode ruby:hover { background-color: #e0f2fe; }
        .ruby-edit-mode ruby.editing-active { background-color: #fce7f3; outline: 2px solid #ec4899; z-index: 10; }
        rt { display: ruby-text; font-size: 0.5em; line-height: 1; text-align: center; color: #555; user-select: none; }
        #preview-container table { border-collapse: collapse; margin: 0.5em 0; }
        #preview-container th, #preview-container td { border: 1px solid #999; padding: 4px 8px; }
        #preview-container th { background: #f3f4f6; font-weight: bold; }
        /* 【修正1】プレビューコンテナ内の画像にもmax-width制限を追加 */
        #preview-container img { max-width: 100%; display: inline-block; vertical-align: middle; }
        #web-iframe { width: 100%; height: 100%; border: none; background: white; }
        .mode-btn { padding: 4px 14px; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: all 0.15s; }
        .mode-btn.active { background: #3b82f6; color: white; }
        .mode-btn:not(.active) { background: #e5e7eb; color: #374151; }
        .mode-btn:not(.active):hover { background: #d1d5db; }

        /* テキスト編集モード：構造を壊さずcontenteditable */
        .text-edit-mode { cursor: text; outline: none; }
        .text-edit-mode:focus { outline: none; }
        .text-edit-mode ruby { cursor: text !important; border-bottom: none !important; }
        .text-edit-mode ruby:hover { background-color: transparent !important; }

        #add-ruby-btn {
            position: absolute; z-index: 100; display: none;
            background: #3b82f6; color: white; border: none; border-radius: 6px;
            padding: 3px 10px; font-size: 12px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); white-space: nowrap;
        }
        #add-ruby-btn:hover { background: #2563eb; }
        #add-ruby-btn::after {
            content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            border: 5px solid transparent; border-top-color: #3b82f6;
        }
        .cross-highlight { background-color: #fef08a; border-radius: 2px; }

        /* テキスト編集モードのキーボードヒント */
        .text-edit-hint {
            font-size: 0.65rem;
            color: #9ca3af;
            background: #f3f4f6;
            border-radius: 4px;
            padding: 1px 6px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

<header class="bg-white shadow-sm z-10 p-3 flex justify-between items-center shrink-0">
    <h1 class="text-xl font-bold text-gray-700">ルビふりお2</h1>
    <div class="flex gap-2">
        <button onclick="openInNewTab()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-1.5 rounded text-sm transition">WEBサイトで表示</button>
        <button onclick="copyHtml()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-1.5 rounded text-sm transition"><i class="fas fa-code mr-1"></i> HTMLコピー</button>
    </div>
</header>

<div class="bg-white border-b border-gray-200 p-2 flex flex-wrap gap-3 items-center shrink-0 text-sm">
    <div class="flex items-center border-r pr-3 gap-2">
        <span class="text-gray-500 text-xs font-bold uppercase">全体サイズ</span>
        <div class="flex items-center">
            <input type="number" id="base-font-size" value="12" min="6" max="72" class="w-14 border border-gray-300 rounded p-1 text-center" onchange="updateBaseFontSize()">
            <span class="ml-1 text-gray-600 text-xs">pt</span>
            <div class="flex flex-col ml-1 gap-0.5">
                <button onmousedown="event.preventDefault()" onclick="stepFontSize(1)" class="bg-gray-200 hover:bg-gray-300 px-1 rounded text-[10px] leading-none">▲</button>
                <button onmousedown="event.preventDefault()" onclick="stepFontSize(-1)" class="bg-gray-200 hover:bg-gray-300 px-1 rounded text-[10px] leading-none">▼</button>
            </div>
        </div>
    </div>
    <div class="flex items-center border-r pr-3 gap-1">
        <select id="font-family-select" onchange="wrapFontFamily(this.value); this.value='';" class="border border-gray-300 rounded p-1 w-24 mr-1 text-xs">
            <option value="" disabled selected>フォント</option>
            <option value="">デフォルト(UD)</option>
            <option value="'UD Digi Kyokasho','YuKyokasho','Kaisho',serif">教科書体</option>
            <option value="'HiraMinProN-W3','YuMincho','MS PMincho',serif">明朝体</option>
            <option value="'Hiragino Kaku Gothic ProN','YuGothic','MS PGothic',sans-serif">ゴシック</option>
            <option value="'Hiragino Maru Gothic ProN','HGMaruGothicMPRO','Rounded Mplus 1c',sans-serif">丸ゴシック</option>
        </select>
        <button onmousedown="event.preventDefault()" onclick="wrapSelection('b')" class="p-1.5 hover:bg-gray-100 rounded" title="太字"><i class="fas fa-bold"></i></button>
        <button onmousedown="event.preventDefault()" onclick="wrapColor('red')" class="p-1.5 hover:bg-gray-100 rounded text-red-500" title="赤文字"><i class="fas fa-font"></i></button>
    </div>
    <div class="flex items-center border-r pr-3 gap-1">
        <button onmousedown="event.preventDefault()" onclick="openImgModal()" class="flex items-center gap-1 p-1.5 hover:bg-gray-100 rounded text-gray-700" title="画像挿入"><i class="fas fa-image"></i></button>
    </div>
    <!-- テキスト編集モード時のヒント表示 -->
    <div id="text-edit-hint-area" class="hidden items-center gap-2 text-xs text-gray-400">
        <span class="text-edit-hint"><kbd>Enter</kbd> → 段落 &lt;p&gt;</span>
        <span class="text-edit-hint"><kbd>Shift+Enter</kbd> → 改行 &lt;br&gt;</span>
    </div>
</div>

<div class="flex flex-1 overflow-hidden">
    <div class="w-1/2 flex flex-col border-r border-gray-300 bg-gray-50">
        <div class="p-2 bg-gray-100 border-b text-xs font-bold text-gray-500"><span>HTMLソース入力</span></div>
        <textarea id="html-editor"
            class="flex-1 w-full p-4 resize-none focus:outline-none focus:ring-2 focus:ring-blue-300 text-gray-800 text-sm leading-relaxed font-mono"
            placeholder="<!-- ここにHTMLを貼り付けてください -->&#13;&#10;<ruby>漢字<rt>かんじ</rt></ruby>..."
            oninput="updatePreview()"></textarea>
    </div>
    <div class="w-1/2 flex flex-col bg-gray-200 overflow-hidden">
        <div class="p-2 bg-gray-200/90 backdrop-blur border-b border-gray-300 flex justify-between items-center text-xs font-bold text-gray-500 shrink-0">
            <div class="flex items-center gap-2">
                <button id="btn-mode-web" class="mode-btn active" onclick="setMode('web')">WEBプレビュー</button>
                <button id="btn-mode-ruby" class="mode-btn" onclick="setMode('ruby')">ルビ編集</button>
                <button id="btn-mode-text" class="mode-btn" onclick="setMode('text')">テキスト編集</button>
            </div>
            <span id="preview-hint" class="text-gray-400">HTMLをそのまま表示</span>
        </div>
        <div class="flex justify-center p-4 min-h-0 flex-1 overflow-y-auto relative" id="preview-scroll-inner">
            <div id="preview-container" class="page-hp preview-content" spellcheck="false"></div>
            <iframe id="web-iframe" sandbox="allow-same-origin allow-scripts" style="width:100%;height:100%;border:none;background:white;"></iframe>
            <button id="add-ruby-btn"
                onmousedown="event.preventDefault(); event.stopPropagation();"
                onclick="addRubyToSelection()">
                <i class="fas fa-plus mr-1"></i>ルビ追加
            </button>
        </div>
    </div>
</div>

<!-- 画像挿入モーダル -->
<div id="img-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-[480px] shadow-2xl relative">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg text-gray-700"><i class="fas fa-image mr-2 text-purple-500"></i>画像を挿入</h3>
            <button onclick="closeImgModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <div class="mb-3">
            <label class="block text-xs text-gray-500 mb-1 font-bold">画像のURL</label>
            <input id="img-url-input" type="text" class="w-full border border-gray-300 rounded p-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-purple-300" placeholder="https://example.com/image.png" oninput="previewImgUrl()">
            <div id="url-preview-wrap" class="flex justify-center bg-gray-100 rounded p-2 min-h-[80px] items-center">
                <img id="url-preview-img" class="max-w-full max-h-[120px] object-contain hidden" alt="プレビュー">
                <span id="url-preview-placeholder" class="text-gray-400 text-xs">URLを入力するとプレビューが表示されます</span>
            </div>
        </div>
        <div class="mt-4 border-t pt-4">
            <p class="text-xs font-bold text-gray-500 mb-2">サイズ・配置設定</p>
            <div class="flex gap-2 flex-wrap items-end mb-2">
                <div><label class="block text-xs text-gray-500 mb-1">幅</label><div class="flex items-center gap-1"><input id="img-width" type="number" placeholder="例: 200" min="1" class="w-20 border border-gray-300 rounded p-1 text-sm" oninput="onImgSizeInput('width')"><select id="img-width-unit" class="border border-gray-300 rounded p-1 text-xs" onchange="onImgSizeInput('width')"><option value="px">px</option><option value="%">%</option><option value="em">em</option></select></div></div>
                <div class="flex items-end pb-1"><button id="btn-aspect-lock" onclick="toggleAspectLock()" title="縦横比の固定/解除" class="w-8 h-8 flex items-center justify-center rounded border border-gray-300 bg-gray-50 hover:bg-yellow-50 hover:border-yellow-400 transition text-gray-500 text-sm"><i id="aspect-lock-icon" class="fas fa-lock-open"></i></button></div>
                <div><label class="block text-xs text-gray-500 mb-1">高さ</label><div class="flex items-center gap-1"><input id="img-height" type="number" placeholder="auto" min="1" class="w-20 border border-gray-300 rounded p-1 text-sm" oninput="onImgSizeInput('height')"><select id="img-height-unit" class="border border-gray-300 rounded p-1 text-xs" onchange="onImgSizeInput('height')"><option value="px">px</option><option value="%">%</option></select></div></div>
            </div>
            <div class="flex gap-3 flex-wrap items-end">
                <div><label class="block text-xs text-gray-500 mb-1">配置</label><select id="img-align" class="border border-gray-300 rounded p-1 text-sm"><option value="">なし（インライン）</option><option value="block-center">中央揃え（ブロック）</option><option value="block-left">左揃え（ブロック）</option><option value="block-right">右揃え（ブロック）</option><option value="float-left">左回り込み</option><option value="float-right">右回り込み</option></select></div>
                <div><label class="block text-xs text-gray-500 mb-1">alt属性</label><input id="img-alt" type="text" placeholder="画像の説明" class="border border-gray-300 rounded p-1 text-sm w-28"></div>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-4">
            <button onclick="closeImgModal()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700">キャンセル</button>
            <button onclick="insertImage()" class="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-bold transition"><i class="fas fa-check mr-1"></i> 挿入</button>
        </div>
    </div>
</div>

<!-- ルビ編集モーダル -->
<div id="ruby-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-96 shadow-xl relative">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg text-gray-700"><i class="fas fa-pen mr-2"></i>ルビ編集</h3>
            <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">Enterで次へ</span>
        </div>
        <div class="flex gap-4 mb-6 items-end">
            <div class="flex-1"><label class="block text-xs text-gray-400 mb-1">漢字</label><div id="modal-kanji-display" class="text-2xl font-bold text-center bg-gray-100 p-2 rounded text-gray-800"></div></div>
            <div class="flex-1"><label class="block text-xs text-blue-500 font-bold mb-1">ふりがな</label><input type="text" id="modal-ruby" class="w-full text-xl border-b-2 border-blue-500 p-2 focus:outline-none bg-transparent text-center" placeholder="読み" autocomplete="off"></div>
        </div>
        <div class="flex justify-between gap-2 mb-4">
            <button onclick="navigateRuby(-1)" class="flex-1 py-1 px-2 text-sm bg-gray-100 hover:bg-gray-200 rounded text-gray-600"><i class="fas fa-chevron-left mr-1"></i> 前へ</button>
            <button onclick="navigateRuby(1)" class="flex-1 py-1 px-2 text-sm bg-blue-500 hover:bg-blue-600 text-white rounded font-bold">保存して次へ (Enter) <i class="fas fa-chevron-right ml-1"></i></button>
        </div>
        <div class="flex justify-end pt-4 border-t gap-3">
            <button onclick="closeRubyModal()" class="text-gray-400 hover:text-gray-600 text-sm">閉じる</button>
            <button onclick="removeRubyTag()" class="text-red-400 hover:text-red-600 text-sm">ルビ解除</button>
        </div>
    </div>
</div>

<!-- ルビ追加モーダル -->
<div id="add-ruby-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-96 shadow-xl relative">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg text-gray-700"><i class="fas fa-plus-circle mr-2 text-blue-500"></i>ルビ追加</h3>
            <button onclick="closeAddRubyModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <div class="flex gap-4 mb-6 items-end">
            <div class="flex-1"><label class="block text-xs text-gray-400 mb-1">対象テキスト</label><div id="add-ruby-kanji" class="text-2xl font-bold text-center bg-gray-100 p-2 rounded text-gray-800"></div></div>
            <div class="flex-1"><label class="block text-xs text-blue-500 font-bold mb-1">ふりがな</label><input type="text" id="add-ruby-input" class="w-full text-xl border-b-2 border-blue-500 p-2 focus:outline-none bg-transparent text-center" placeholder="読みを入力" autocomplete="off"></div>
        </div>
        <div class="flex justify-end gap-2">
            <button onclick="closeAddRubyModal()" class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700">キャンセル</button>
            <button onclick="confirmAddRuby()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition"><i class="fas fa-check mr-1"></i> 追加</button>
        </div>
    </div>
</div>

<script>
const editor = document.getElementById('html-editor');
const preview = document.getElementById('preview-container');
const baseFontSizeInput = document.getElementById('base-font-size');
const webIframe = document.getElementById('web-iframe');
const previewHint = document.getElementById('preview-hint');
const addRubyBtn = document.getElementById('add-ruby-btn');
const textEditHintArea = document.getElementById('text-edit-hint-area');

let currentTargetRuby = null, lastRange = null;
let currentMode = 'web';
let editorCursorPos = null, previewInsertRange = null;
let aspectLocked = false, aspectRatio = null, changingFrom = null;
let addRubyRange = null;
let addRubyBtnVisible = false;

try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch(e) {}

editor.addEventListener('click', () => { editorCursorPos = editor.selectionStart; previewInsertRange = null; });
editor.addEventListener('keyup', () => { editorCursorPos = editor.selectionStart; previewInsertRange = null; });

preview.addEventListener('mouseup', () => {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && preview.contains(sel.anchorNode)) {
        previewInsertRange = sel.getRangeAt(0).cloneRange();
        previewInsertRange.collapse(true);
        editorCursorPos = null;
    }
});

window.addEventListener('DOMContentLoaded', () => {
    updateBaseFontSize();
    preview.classList.add('hidden');
    webIframe.classList.remove('hidden');
    updateWebIframe();
});

// ===================== モード切替 =====================
function setMode(mode) {
    if (currentMode === 'text' && mode !== 'text') {
        syncTextModeToEditor();
        preview.contentEditable = 'false';
        preview.classList.remove('text-edit-mode');
    }
    currentMode = mode;
    document.getElementById('btn-mode-web').classList.toggle('active', mode === 'web');
    document.getElementById('btn-mode-ruby').classList.toggle('active', mode === 'ruby');
    document.getElementById('btn-mode-text').classList.toggle('active', mode === 'text');
    hideAddRubyBtn();

    if (mode === 'text') {
        textEditHintArea.classList.remove('hidden');
        textEditHintArea.classList.add('flex');
    } else {
        textEditHintArea.classList.add('hidden');
        textEditHintArea.classList.remove('flex');
    }

    if (mode === 'web') {
        preview.classList.add('hidden'); webIframe.classList.remove('hidden');
        preview.contentEditable = 'false';
        preview.classList.remove('ruby-edit-mode', 'text-edit-mode');
        previewHint.textContent = 'HTMLをそのまま表示';
        updateWebIframe();
    } else if (mode === 'ruby') {
        preview.classList.remove('hidden'); webIframe.classList.add('hidden');
        preview.contentEditable = 'false';
        preview.classList.add('ruby-edit-mode'); preview.classList.remove('text-edit-mode');
        previewHint.textContent = 'クリックでルビ編集 / テキスト選択でルビ追加';
        updatePreview();
    } else {
        preview.classList.remove('hidden'); webIframe.classList.add('hidden');
        preview.classList.remove('ruby-edit-mode'); preview.classList.add('text-edit-mode');
        previewHint.textContent = 'テキストを直接編集（モード切替で反映）';
        enterTextEditMode();
    }
}

// ===================== テキスト編集モード =====================
function enterTextEditMode() {
    preview.innerHTML = editor.value;
    preview.querySelectorAll('ruby').forEach(r => { r.onclick = null; });
    preview.contentEditable = 'true';
    preview.focus();
}

// ===================== テキスト編集モードのキーボード操作 =====================
preview.addEventListener('keydown', (e) => {
    if (currentMode !== 'text') return;

    if (e.key === 'Enter') {
        e.preventDefault();

        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;

        const range = sel.getRangeAt(0);
        range.deleteContents();

        if (e.shiftKey) {
            const br = document.createElement('br');
            range.insertNode(br);
            br.parentNode.insertBefore(document.createTextNode(''), br.nextSibling);
            const newRange = document.createRange();
            if (br.nextSibling) {
                newRange.setStartBefore(br.nextSibling);
            } else {
                newRange.setStartAfter(br);
            }
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
        } else {
            const p = document.createElement('p');
            p.appendChild(document.createElement('br'));
            range.insertNode(p);
            const newRange = document.createRange();
            newRange.setStart(p, 0);
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
        }
    }
});

// ===================== テキスト編集→エディタ同期 =====================
function syncTextModeToEditor() {
    const c = preview.cloneNode(true);

    c.querySelectorAll('.cross-highlight').forEach(el => {
        const p = el.parentNode;
        while (el.firstChild) p.insertBefore(el.firstChild, el);
        p.removeChild(el);
    });

    c.removeAttribute('contenteditable');
    c.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));

    ['text-edit-mode', 'ruby-edit-mode', 'preview-content', 'page-hp'].forEach(cls => {
        c.classList.remove(cls);
    });

    editor.value = c.innerHTML
        .replace(/ class=""/g, '')
        .replace(/ style=""/g, '');
}

// ===================== ルビ追加ボタン =====================
function hideAddRubyBtn() {
    addRubyBtn.style.display = 'none';
    addRubyBtnVisible = false;
    addRubyRange = null;
}

function showAddRubyBtn(range) {
    addRubyRange = range.cloneRange();
    lastRange = range.cloneRange();
    const rect = range.getBoundingClientRect();
    const container = document.getElementById('preview-scroll-inner');
    const cRect = container.getBoundingClientRect();
    addRubyBtn.style.display = 'block';
    addRubyBtn.style.left = (rect.left + rect.width / 2 - cRect.left - 40) + 'px';
    addRubyBtn.style.top = (rect.top - cRect.top - 32 + container.scrollTop) + 'px';
    addRubyBtnVisible = true;
}

preview.addEventListener('mouseup', (e) => {
    if (currentMode !== 'ruby') return;
    if (e.target === addRubyBtn || addRubyBtn.contains(e.target)) return;
    setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { hideAddRubyBtn(); return; }
        const r = sel.getRangeAt(0);
        if (!preview.contains(r.commonAncestorContainer)) { hideAddRubyBtn(); return; }
        const txt = sel.toString().trim();
        if (!txt) { hideAddRubyBtn(); return; }
        let node = r.commonAncestorContainer;
        while (node && node !== preview) {
            if (node.nodeName === 'RUBY') { hideAddRubyBtn(); return; }
            node = node.parentNode;
        }
        showAddRubyBtn(r);
        capturePreviewSelectionRange();
    }, 10);
});

document.addEventListener('mousedown', (e) => {
    if (!addRubyBtnVisible) return;
    if (e.target === addRubyBtn || addRubyBtn.contains(e.target)) return;
    if (document.getElementById('add-ruby-modal').contains(e.target)) return;
    hideAddRubyBtn();
});

function addRubyToSelection() {
    if (!addRubyRange) return;
    const txt = addRubyRange.toString().trim();
    if (!txt) return;
    document.getElementById('add-ruby-kanji').textContent = txt;
    document.getElementById('add-ruby-input').value = '';
    document.getElementById('add-ruby-modal').classList.remove('hidden');
    document.getElementById('add-ruby-modal').classList.add('flex');
    setTimeout(() => document.getElementById('add-ruby-input').focus(), 50);
    addRubyBtn.style.display = 'none';
}

function closeAddRubyModal() {
    document.getElementById('add-ruby-modal').classList.add('hidden');
    document.getElementById('add-ruby-modal').classList.remove('flex');
    addRubyRange = null;
    addRubyBtnVisible = false;
}

function confirmAddRuby() {
    const reading = document.getElementById('add-ruby-input').value.trim();
    if (!reading) { document.getElementById('add-ruby-input').focus(); return; }
    if (!addRubyRange) { closeAddRubyModal(); return; }
    const txt = addRubyRange.toString();
    const rubyEl = document.createElement('ruby');
    rubyEl.textContent = txt;
    const rtEl = document.createElement('rt');
    rtEl.textContent = reading;
    rubyEl.appendChild(rtEl);
    addRubyRange.deleteContents();
    addRubyRange.insertNode(rubyEl);
    syncPreviewToEditor();
    attachRubyClickEvents();
    closeAddRubyModal();
}

document.getElementById('add-ruby-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); confirmAddRuby(); }
});

// ===================== クロスハイライト =====================
let hlTimeout = null;
function clearCrossHighlights() {
    preview.querySelectorAll('.cross-highlight').forEach(el => {
        const parent = el.parentNode;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
    });
}
editor.addEventListener('select', () => {
    if (currentMode === 'web') return;
    clearCrossHighlights();
    if (hlTimeout) clearTimeout(hlTimeout);
    hlTimeout = setTimeout(() => {
        const s = editor.selectionStart, e = editor.selectionEnd;
        if (s === e) return;
        const selText = editor.value.substring(s, e);
        const plainSel = selText.replace(/<[^>]*>/g, '').trim();
        if (!plainSel || plainSel.length < 1) return;
        highlightTextInPreview(plainSel);
    }, 200);
});
function highlightTextInPreview(text) {
    if (!text || currentMode === 'web') return;
    const walker = document.createTreeWalker(preview, NodeFilter.SHOW_TEXT, null, false);
    const textNodes = []; let n;
    while (n = walker.nextNode()) {
        if (n.parentNode && n.parentNode.nodeName === 'RT') continue;
        textNodes.push(n);
    }
    let combined = ''; const map = [];
    for (const tn of textNodes) { map.push({ node: tn, start: combined.length, len: tn.textContent.length }); combined += tn.textContent; }
    const idx = combined.indexOf(text);
    if (idx === -1) return;
    const end = idx + text.length;
    for (const m of map) {
        const mEnd = m.start + m.len;
        if (mEnd <= idx || m.start >= end) continue;
        const hlStart = Math.max(0, idx - m.start), hlEnd = Math.min(m.len, end - m.start);
        const tn = m.node, before = tn.textContent.substring(0, hlStart), mid = tn.textContent.substring(hlStart, hlEnd), after = tn.textContent.substring(hlEnd);
        const frag = document.createDocumentFragment();
        if (before) frag.appendChild(document.createTextNode(before));
        const span = document.createElement('span'); span.className = 'cross-highlight'; span.textContent = mid; frag.appendChild(span);
        if (after) frag.appendChild(document.createTextNode(after));
        tn.parentNode.replaceChild(frag, tn);
    }
}
preview.addEventListener('mouseup', () => {
    if (currentMode === 'web') return;
    setTimeout(() => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || !preview.contains(sel.anchorNode)) return;
        const selText = sel.toString().trim();
        if (!selText || selText.length < 1) return;
        const plain = editor.value.replace(/<[^>]*>/g, '');
        const idx = plain.indexOf(selText);
        if (idx === -1) return;
        const htmlPos = plainIndexToHtmlIndex(editor.value, idx, selText.length);
        if (htmlPos) { editor.focus(); editor.selectionStart = htmlPos.start; editor.selectionEnd = htmlPos.end; }
    }, 100);
});
function plainIndexToHtmlIndex(html, plainStart, plainLen) {
    let pi = 0, hi = 0, inTag = false, start = -1, end = -1;
    for (hi = 0; hi < html.length; hi++) {
        if (html[hi] === '<') { inTag = true; continue; }
        if (html[hi] === '>') { inTag = false; continue; }
        if (inTag) continue;
        if (pi === plainStart && start === -1) start = hi;
        pi++;
        if (pi === plainStart + plainLen) { end = hi + 1; break; }
    }
    if (start === -1) return null;
    if (end === -1) end = html.length;
    return { start, end };
}

// ===================== 縦横比ロック =====================
function toggleAspectLock() {
    aspectLocked = !aspectLocked;
    const icon = document.getElementById('aspect-lock-icon'), btn = document.getElementById('btn-aspect-lock');
    if (aspectLocked) {
        icon.className = 'fas fa-lock'; btn.classList.add('bg-yellow-100','border-yellow-400','text-yellow-600'); btn.classList.remove('bg-gray-50','border-gray-300','text-gray-500');
        const w = parseFloat(document.getElementById('img-width').value), h = parseFloat(document.getElementById('img-height').value);
        aspectRatio = (w > 0 && h > 0) ? w / h : null;
    } else {
        icon.className = 'fas fa-lock-open'; btn.classList.remove('bg-yellow-100','border-yellow-400','text-yellow-600'); btn.classList.add('bg-gray-50','border-gray-300','text-gray-500');
        aspectRatio = null;
    }
}
function onImgSizeInput(from) {
    if (!aspectLocked || changingFrom) return;
    if (!aspectRatio) { const w=parseFloat(document.getElementById('img-width').value),h=parseFloat(document.getElementById('img-height').value); if(w>0&&h>0) aspectRatio=w/h; return; }
    changingFrom = from;
    if (from==='width') { const w=parseFloat(document.getElementById('img-width').value); if(w>0) document.getElementById('img-height').value=Math.round(w/aspectRatio); }
    else { const h=parseFloat(document.getElementById('img-height').value); if(h>0) document.getElementById('img-width').value=Math.round(h*aspectRatio); }
    changingFrom = null;
}

// ===================== 画像モーダル =====================
function openImgModal() {
    if (!previewInsertRange) editorCursorPos = editor.selectionStart;
    const m = document.getElementById('img-modal'); m.classList.remove('hidden'); m.classList.add('flex');
    document.getElementById('img-url-input').value=''; document.getElementById('url-preview-img').classList.add('hidden');
    document.getElementById('url-preview-placeholder').textContent='URLを入力するとプレビューが表示されます'; document.getElementById('url-preview-placeholder').classList.remove('hidden');
    ['img-width','img-height'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('img-align').value=''; document.getElementById('img-alt').value='';
    aspectLocked=false; aspectRatio=null; document.getElementById('aspect-lock-icon').className='fas fa-lock-open';
    const btn=document.getElementById('btn-aspect-lock'); btn.classList.remove('bg-yellow-100','border-yellow-400','text-yellow-600'); btn.classList.add('bg-gray-50','border-gray-300','text-gray-500');
}
function closeImgModal() { document.getElementById('img-modal').classList.add('hidden'); document.getElementById('img-modal').classList.remove('flex'); }
function previewImgUrl() {
    const url=document.getElementById('img-url-input').value.trim(),img=document.getElementById('url-preview-img'),ph=document.getElementById('url-preview-placeholder');
    if(!url){img.classList.add('hidden');ph.textContent='URLを入力するとプレビューが表示されます';ph.classList.remove('hidden');return;}
    img.onload=()=>{img.classList.remove('hidden');ph.classList.add('hidden');};
    img.onerror=()=>{img.classList.add('hidden');ph.textContent='⚠ 画像を読み込めません';ph.classList.remove('hidden');};
    img.src=url;
}
function buildImgTag(src) {
    const w=document.getElementById('img-width').value.trim(),wU=document.getElementById('img-width-unit').value;
    const h=document.getElementById('img-height').value.trim(),hU=document.getElementById('img-height-unit').value;
    const align=document.getElementById('img-align').value,alt=document.getElementById('img-alt').value.trim();
    let s=''; if(w)s+=`width:${w}${wU};`; if(h)s+=`height:${h}${hU};`; else if(w)s+='height:auto;';
    if(align==='float-left')s+='float:left;margin-right:0.5em;'; if(align==='float-right')s+='float:right;margin-left:0.5em;';
    const sa=s?` style="${s}"`:''; const tag=`<img src="${src}" alt="${alt}"${sa}>`;
    if(align==='block-center')return`<div style="text-align:center;line-height:1">${tag}</div>`;
    if(align==='block-left')return`<div style="text-align:left;line-height:1">${tag}</div>`;
    if(align==='block-right')return`<div style="text-align:right;line-height:1">${tag}</div>`;
    return tag;
}

// 【修正2】insertImage: テキスト編集モード対応
function insertImage() {
    const src=document.getElementById('img-url-input').value.trim();
    if(!src){alert('URLを入力してください');return;}
    const tag=buildImgTag(src);

    if (currentMode === 'text') {
        // テキスト編集モード: プレビューDOMに直接挿入し、テキスト編集用の同期を使う
        if (previewInsertRange) {
            const d=document.createElement('div'); d.innerHTML=tag;
            const f=document.createDocumentFragment();
            while(d.firstChild) f.appendChild(d.firstChild);
            previewInsertRange.insertNode(f);
            previewInsertRange=null;
        } else {
            // プレビュー内にカーソルがない場合は末尾に追加
            const d=document.createElement('div'); d.innerHTML=tag;
            const f=document.createDocumentFragment();
            while(d.firstChild) f.appendChild(d.firstChild);
            preview.appendChild(f);
        }
        // テキスト編集モード用の同期でエディタに反映
        syncTextModeToEditor();
    } else if (previewInsertRange) {
        // ルビ編集モード等でプレビュー内にカーソルがある場合
        const d=document.createElement('div'); d.innerHTML=tag;
        const f=document.createDocumentFragment();
        while(d.firstChild) f.appendChild(d.firstChild);
        previewInsertRange.insertNode(f);
        previewInsertRange=null;
        syncPreviewToEditor();
    } else {
        // エディタに直接挿入
        const p=(editorCursorPos!==null)?editorCursorPos:editor.value.length;
        editor.value=editor.value.substring(0,p)+tag+editor.value.substring(p);
        editorCursorPos=p+tag.length;
        editor.selectionStart=editor.selectionEnd=editorCursorPos;
        editor.focus();
    }

    closeImgModal();
    // テキスト編集モード以外はプレビュー更新
    if (currentMode !== 'text') updatePreview();
}

// ===================== プレビュー更新 =====================
function updatePreview() {
    if (currentMode === 'web') { updateWebIframe(); return; }
    if (currentMode === 'text') return;
    preview.innerHTML = editor.value;
    attachRubyClickEvents();
}

function updateBaseFontSize() {
    preview.style.fontSize = (parseInt(baseFontSizeInput.value) || 12) + 'pt';
    if (currentMode === 'web') updateWebIframe();
}
function stepFontSize(d) {
    baseFontSizeInput.value = Math.max(6, (parseInt(baseFontSizeInput.value) || 12) + d);
    updateBaseFontSize();
}

function updateWebIframe() {
    const sz = parseInt(baseFontSizeInput.value) || 12;
    webIframe.srcdoc = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>body{font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:${sz}pt;line-height:2.0;padding:1.5rem;margin:0;overflow-wrap:break-word;}table{border-collapse:collapse;margin:0.5em 0;}th,td{border:1px solid #999;padding:4px 8px;}th{background:#f3f4f6;font-weight:bold;}ruby{display:inline-ruby;}rt{font-size:0.5em;line-height:1;color:#555;}img{max-width:100%;display:inline-block;vertical-align:middle;}</style></head><body>${editor.value}</body></html>`;
}
function openInNewTab() {
    const sz = parseInt(baseFontSizeInput.value) || 12;
    const h = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ルビふりお2</title><style>body{font-family:"BIZ UDPGothic","BIZ UDGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","Yu Gothic",sans-serif;font-size:${sz}pt;line-height:2.0;padding:2rem;margin:0;overflow-wrap:break-word;background:white;}table{border-collapse:collapse;margin:0.5em 0;}th,td{border:1px solid #999;padding:4px 8px;}th{background:#f3f4f6;font-weight:bold;}ruby{display:inline-ruby;}rt{font-size:0.5em;line-height:1;color:#555;text-align:center;}img{max-width:100%;display:inline-block;vertical-align:middle;}</style></head><body>${editor.value}</body></html>`;
    const b = new Blob([h], {type:'text/html;charset=utf-8'}); const u = URL.createObjectURL(b); window.open(u, '_blank'); setTimeout(() => URL.revokeObjectURL(u), 10000);
}

// ===================== 選択範囲キャプチャ =====================
function capturePreviewSelectionRange() {
    if (currentMode === 'text') return;
    const sel = window.getSelection(); if (!sel || sel.rangeCount === 0) return;
    const r = sel.getRangeAt(0);
    if (!r.collapsed && preview.contains(r.commonAncestorContainer)) lastRange = r.cloneRange();
}

// ===================== 装飾 =====================
function applyStyleToSelection(s, e2) {
    const sel = window.getSelection();
    if (sel.rangeCount > 0 && preview.contains(sel.anchorNode)) applyStyleToPreview(s, e2, sel.getRangeAt(0));
    else if (lastRange && preview.contains(lastRange.commonAncestorContainer)) applyStyleToPreview(s, e2, lastRange);
    else insertTagToEditor(s, e2);
}
function applyStyleToPreview(s, e2, range) {
    if (!range || range.collapsed) return;
    const tmp = document.createElement('div'); tmp.innerHTML = s + 'dummy' + e2; const w = tmp.firstElementChild;
    if (w) {
        try {
            const lr = range.cloneRange(); const c = lr.extractContents(); w.innerHTML = ''; w.appendChild(c); lr.insertNode(w);
            if (currentMode === 'text') syncTextModeToEditor();
            else syncPreviewToEditor();
            const nr = document.createRange(); nr.selectNodeContents(w); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(nr); lastRange = nr.cloneRange();
        } catch(err) { alert('その選択範囲には適用できませんでした'); }
    }
}
function insertTagToEditor(s, e2) {
    const st = editor.selectionStart, en = editor.selectionEnd, t = editor.value;
    editor.value = t.substring(0, st) + s + t.substring(st, en) + e2 + t.substring(en);
    editor.focus(); editor.selectionStart = st + s.length; editor.selectionEnd = en + s.length; updatePreview();
}
function wrapSelection(tag) { applyStyleToSelection(`<${tag}>`, `</${tag}>`); }
function wrapColor(c) { applyStyleToSelection(`<span style="color:${c}">`, '</span>'); }
function wrapFontFamily(f) { if (!f) return; applyStyleToSelection(`<span style="font-family:${f}">`, '</span>'); }

// ===================== ルビ編集 =====================
function attachRubyClickEvents() {
    preview.querySelectorAll('ruby').forEach(r => {
        r.onclick = e => { e.stopPropagation(); openRubyModal(r); };
        r.title = '編集する';
    });
}
const modal = document.getElementById('ruby-modal'), modalKanjiDisplay = document.getElementById('modal-kanji-display'), modalRuby = document.getElementById('modal-ruby');
function openRubyModal(rubyEl) {
    if (currentMode !== 'ruby') return;
    if (currentTargetRuby) currentTargetRuby.classList.remove('editing-active');
    currentTargetRuby = rubyEl; currentTargetRuby.classList.add('editing-active');
    let k = ''; rubyEl.childNodes.forEach(n => { if (n.nodeType === Node.TEXT_NODE) k += n.textContent; });
    const rt = rubyEl.querySelector('rt'); modalKanjiDisplay.textContent = k; modalRuby.value = rt ? rt.textContent : '';
    modal.classList.remove('hidden'); modal.classList.add('flex'); modalRuby.focus();
}
function closeRubyModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); if (currentTargetRuby) { currentTargetRuby.classList.remove('editing-active'); currentTargetRuby = null; } }
function saveRubyAndStay() { if (!currentTargetRuby) return; const rt = currentTargetRuby.querySelector('rt'); if (rt) rt.textContent = modalRuby.value; syncPreviewToEditor(); }
function navigateRuby(dir) { if (!currentTargetRuby) return; saveRubyAndStay(); const all = Array.from(preview.querySelectorAll('ruby')); const ni = all.indexOf(currentTargetRuby) + dir; if (ni >= 0 && ni < all.length) openRubyModal(all[ni]); else closeRubyModal(); }
function removeRubyTag() { if (!currentTargetRuby) return; let k = ''; currentTargetRuby.childNodes.forEach(n => { if (n.nodeType === Node.TEXT_NODE) k += n.textContent; }); currentTargetRuby.parentNode.replaceChild(document.createTextNode(k), currentTargetRuby); syncPreviewToEditor(); closeRubyModal(); }

// ===================== 同期（ルビ編集用） =====================
function syncPreviewToEditor() {
    const c = preview.cloneNode(true);
    c.querySelectorAll('.cross-highlight').forEach(el => { const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); });
    c.querySelectorAll('table br').forEach(br => br.replaceWith(document.createTextNode('\x00TDBR\x00')));
    c.querySelectorAll('br').forEach(br => br.replaceWith(document.createTextNode('\n')));
    editor.value = c.innerHTML.replace(/\x00TDBR\x00/g, '<br>');
}

function copyHtml() { navigator.clipboard.writeText(editor.value).then(() => alert('コピーしました')); }

modal.addEventListener('click', e => { if (e.target === modal) closeRubyModal(); });
document.getElementById('img-modal').addEventListener('click', e => { if (e.target === document.getElementById('img-modal')) closeImgModal(); });
document.getElementById('add-ruby-modal').addEventListener('click', e => { if (e.target === document.getElementById('add-ruby-modal')) closeAddRubyModal(); });
modalRuby.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); navigateRuby(1); } });
